<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>ワクワクITたんけんたい</title>

  <!-- QR読み取り。カメラはGitHub PagesなどのHTTPS上で使用してください。 -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --green: #22c55e;
      --green-dark: #14532d;
      --green-mid: #166534;
      --green-light: #dcfce7;
      --yellow: #facc15;
      --orange: #fb923c;
      --red: #ef4444;
      --cream: #fff8e7;
      --brown: #4b2e13;
      --ink: #24311f;
      --white: #fffefa;
      --shadow: 0 18px 50px rgba(20, 83, 45, 0.22);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 8%, rgba(255,255,255,.60), transparent 23%),
        radial-gradient(circle at 88% 18%, rgba(250,204,21,.28), transparent 20%),
        linear-gradient(145deg, #a7f3d0, #67e8f9 52%, #86efac);
    }

    body {
      padding: 14px;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .14s ease, filter .14s ease, box-shadow .14s ease;
    }

    button:active {
      transform: translateY(3px);
      filter: brightness(.98);
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: calc(100vh - 28px);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,.72);
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,248,231,.98));
      box-shadow: var(--shadow);
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 8% 15%, rgba(34,197,94,.12), transparent 24%),
        radial-gradient(circle at 94% 84%, rgba(250,204,21,.14), transparent 24%);
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      z-index: 0;
      font-size: 82px;
      opacity: .17;
      animation: leafFloat 5s ease-in-out infinite;
      pointer-events: none;
    }

    .leaf.one {
      top: -24px;
      left: -22px;
      transform: rotate(-20deg);
    }

    .leaf.two {
      top: 110px;
      right: -36px;
      transform: rotate(28deg);
      animation-delay: 1.1s;
    }

    .leaf.three {
      bottom: -30px;
      left: -24px;
      transform: rotate(18deg);
      animation-delay: .6s;
    }

    @keyframes leafFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 8px; }
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 28px);
      padding: 22px 18px 78px;
      display: flex;
      flex-direction: column;
      animation: screenIn .25s ease;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .admin-button {
      position: absolute;
      top: auto;
      left: auto;
      right: 12px;
      bottom: 12px;
      z-index: 8;
      width: 64px;
      height: 40px;
      margin: 0;
      padding: 0;
      border-radius: 14px;
      background: #fff7ed;
      color: #9a3412;
      border: 2px solid #fdba74;
      box-shadow: 0 4px 0 #fb923c;
      font-size: 14px;
      line-height: 1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 auto 12px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(220,252,231,.92);
      border: 2px solid rgba(34,197,94,.26);
      color: #15803d;
      font-size: 13px;
      font-weight: 900;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      text-align: center;
      color: var(--brown);
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.12;
    }

    h2 {
      text-align: center;
      color: var(--brown);
      font-size: 25px;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.75;
    }

    .hero,
    .story {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .hero-icon {
      font-size: 88px;
      margin: 18px 0;
      animation: pop 1.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 0 rgba(20,83,45,.08));
    }

    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    .glass {
      background: rgba(255,255,255,.82);
      border: 2px solid rgba(34,197,94,.18);
      border-radius: 24px;
      padding: 16px;
      margin: 16px 0;
      box-shadow: 0 8px 22px rgba(20,83,45,.08);
      backdrop-filter: blur(10px);
    }

    .rules {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      text-align: left;
    }

    .rule {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #f0fdf4;
      padding: 10px;
      border-radius: 16px;
      font-weight: 800;
      color: #25512e;
    }

    .rule span {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow);
      color: #78350f;
      flex: 0 0 auto;
    }

    .primary {
      background: linear-gradient(180deg, #34d399, #16a34a);
      color: #fff;
      box-shadow: 0 7px 0 #15803d, 0 12px 20px rgba(22,163,74,.22);
    }

    .secondary {
      background: #fef3c7;
      color: #7c2d12;
      box-shadow: 0 5px 0 #f59e0b;
    }

    .ghost {
      background: rgba(255,255,255,.84);
      color: #49604a;
      border: 2px solid rgba(20,83,45,.12);
    }

    .danger {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 5px 0 #b91c1c;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 4px 0 12px;
    }

    .topline-title {
      font-weight: 900;
      color: #166534;
    }

    .counter {
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff7ed;
      border: 2px solid #fed7aa;
      color: #c2410c;
      font-weight: 900;
      white-space: nowrap;
    }

    .scene {
      position: relative;
      height: 280px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, #d9f99d, #86efac 52%, #4ade80);
      border: 4px solid rgba(255,255,255,.72);
      box-shadow: 0 14px 28px rgba(20,83,45,.18);
      margin: 8px 0 18px;
    }

    .scene::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background: linear-gradient(180deg, #5b7d2b, #365314);
    }

    .forest-left,
    .forest-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 49%;
      z-index: 3;
      background:
        radial-gradient(circle at 35% 15%, #166534 0 16%, transparent 17%),
        radial-gradient(circle at 62% 30%, #15803d 0 18%, transparent 19%),
        linear-gradient(90deg, #14532d, #166534);
    }

    .forest-left {
      left: 0;
      animation: openLeft 7s ease forwards;
    }

    .forest-right {
      right: 0;
      animation: openRight 7s ease forwards;
    }

    @keyframes openLeft {
      0%, 20% { transform: translateX(0); }
      100% { transform: translateX(-92%); }
    }

    @keyframes openRight {
      0%, 20% { transform: translateX(0); }
      100% { transform: translateX(92%); }
    }

    .path {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 110px;
      height: 190px;
      transform: translateX(-50%) perspective(220px) rotateX(58deg);
      transform-origin: bottom;
      background: linear-gradient(#fde68a, #d6a56f);
      z-index: 1;
    }

    .scene-text {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 7;
      background: rgba(255,255,255,.92);
      border-radius: 18px;
      padding: 12px;
      font-weight: 900;
      color: #14532d;
      opacity: 0;
      animation: textIn .7s ease 5.6s forwards;
    }

    @keyframes textIn {
      to {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .log-pile {
      position: absolute;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 56px;
      letter-spacing: -16px;
      animation: logShake .6s ease 1s 3, logFall 1.5s ease 2.5s forwards;
    }

    @keyframes logShake {
      0%, 100% { transform: translateX(-50%) rotate(0); }
      25% { transform: translateX(-52%) rotate(-3deg); }
      75% { transform: translateX(-48%) rotate(3deg); }
    }

    @keyframes logFall {
      to {
        transform: translate(-50%, 150px) rotate(22deg);
        opacity: 0;
      }
    }

    .river {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      z-index: 2;
      background:
        repeating-radial-gradient(ellipse at 20% 40%, rgba(255,255,255,.34) 0 5px, transparent 6px 18px),
        linear-gradient(180deg, #38bdf8, #0369a1);
      animation: waterMove 2s linear infinite;
    }

    @keyframes waterMove {
      50% { background-position: 22px 0, 0 0; }
    }

    .sun-drop {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      font-size: 64px;
      transform: translateX(-50%);
      animation: dropUp 3s ease 1.2s forwards, glow 1s ease-in-out infinite;
    }

    @keyframes dropUp {
      0% { bottom: 20px; opacity: .65; }
      75%, 100% { bottom: 142px; opacity: 1; }
    }

    @keyframes glow {
      50% {
        filter: drop-shadow(0 0 18px #fde047);
        transform: translateX(-50%) scale(1.08);
      }
    }

    .boss {
      position: absolute;
      left: 50%;
      top: 50px;
      transform: translateX(-50%);
      z-index: 4;
      font-size: 96px;
      animation: bossHit 2.8s ease 2.2s forwards;
    }

    @keyframes bossHit {
      0% { transform: translateX(-50%); }
      35% { transform: translateX(-50%) scale(1.16); }
      100% {
        transform: translate(240px, -120px) rotate(30deg);
        opacity: 0;
      }
    }

    .energy {
      position: absolute;
      left: 32px;
      bottom: 62px;
      width: 68px;
      height: 68px;
      z-index: 6;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 12%, #fde047 20%, #f59e0b 56%, transparent 60%);
      box-shadow: 0 0 26px #facc15;
      animation: energyBlast 2.2s ease 1.4s forwards;
    }

    @keyframes energyBlast {
      0% { transform: scale(.5); }
      50% { transform: translate(140px, -60px) scale(1.3); }
      100% {
        transform: translate(210px, -96px) scale(1.8);
        opacity: 0;
      }
    }

    .mission-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 12px 0;
    }

    .mission-card {
      min-height: 142px;
      border-radius: 22px;
      border: 4px solid #e7e5df;
      background: linear-gradient(180deg, #fff, #f8f5ec);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px;
      filter: grayscale(1);
      opacity: .62;
      box-shadow: 0 8px 18px rgba(20,83,45,.09);
      transition: .25s ease;
    }

    .mission-card:last-child {
      grid-column: 1 / -1;
      width: calc(50% - 6px);
      justify-self: center;
    }

    .mission-card.done {
      filter: none;
      opacity: 1;
      transform: translateY(-2px);
    }

    .mission-card.wind.done {
      background: linear-gradient(160deg, #fef3c7, #d6a56f);
      border-color: #92400e;
    }

    .mission-card.water.done {
      background: linear-gradient(160deg, #fff7c2, #facc15);
      border-color: #f59e0b;
    }

    .mission-card.fire.done {
      background: linear-gradient(160deg, #fecaca, #f87171);
      border-color: #dc2626;
    }

    .mission-icon {
      font-size: 52px;
    }

    .mission-name {
      font-size: 18px;
      font-weight: 900;
      color: var(--brown);
    }

    .mission-sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      color: #64715f;
    }

    .next-box {
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 20px;
      padding: 14px;
      margin: 14px 0;
      color: #9a3412;
      font-weight: 900;
      text-align: center;
    }

    .staff-panel {
      margin-top: 12px;
      padding: 14px;
      border-radius: 22px;
      background: #fff7ed;
      border: 2px solid #fed7aa;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .staff-grid button {
      margin-top: 0;
      padding: 13px;
      font-size: 15px;
      background: #ffedd5;
      color: #9a3412;
      border: 2px solid #fdba74;
      box-shadow: none;
    }

    .staff-grid button.done {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }








    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti span {
      position: absolute;
      top: -30px;
      width: 10px;
      height: 18px;
      border-radius: 3px;
      animation: confettiFall 2.8s linear infinite;
    }

    @keyframes confettiFall {
      to { transform: translateY(110vh) rotate(360deg); }
    }

    .footer {
      margin: auto -18px -18px;
      padding: 15px 18px;
      text-align: center;
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      font-weight: 900;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      padding: 16px;
      align-items: center;
      justify-content: center;
      background: rgba(20,30,18,.82);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 450px;
      border-radius: 28px;
      padding: 18px;
      background: #fffef5;
      border: 3px solid rgba(255,255,255,.8);
      box-shadow: 0 22px 60px rgba(0,0,0,.35);
    }

    #reader {
      width: 100%;
      min-height: 290px;
      border-radius: 22px;
      overflow: hidden;
      background: #111;
      border: 4px solid #bbf7d0;
    }

    .scan-note {
      margin: 10px 0 14px;
      padding: 12px;
      border-radius: 18px;
      background: #f0fdf4;
      border: 2px solid #bbf7d0;
      color: #166534;
      font-weight: 800;
      line-height: 1.65;
    }

    /* 人数選択 */
    .player-count-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 6px 0 18px;
    }

    .player-count-button {
      min-height: 88px;
      margin: 0;
      padding: 12px;
      background: #f0fdf4;
      color: #166534;
      border: 3px solid #bbf7d0;
      box-shadow: 0 5px 0 #86efac;
      font-size: 18px;
    }

    .player-count-button span {
      display: block;
      font-size: 34px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .player-count-button.selected {
      background: linear-gradient(180deg, #34d399, #16a34a);
      color: #fff;
      border-color: #15803d;
      box-shadow: 0 6px 0 #166534;
    }

    @media (max-width: 360px) {
      body {
        padding: 8px;
      }

      .app,
      .screen {
        min-height: calc(100vh - 16px);
      }

      .screen {
        padding: 18px 14px 74px;
      }

      .scene {
        height: 245px;
      }

      .mission-card {
        min-height: 126px;
      }

      .mission-icon {
        font-size: 44px;
      }
    }



  </style>
</head>

<body>
  <main class="app">
    <div class="leaf one">🌿</div>
    <div class="leaf two">🍃</div>
    <div class="leaf three">🌱</div>

    <button class="admin-button" type="button" aria-label="スタッフ管理" onclick="openStaffLogin()">管理</button>

    <section id="screen" class="screen"></section>
  </main>


  <div id="staffLoginModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="pill">🔧 スタッフ専用</div>
      <h2>スタッフ管理を開く</h2>

      <div class="scan-note">
        パスワードを入力してください。
      </div>

      <input
        id="staffPasswordInput"
        class="name-input"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="パスワード"
        onkeydown="if(event.key === 'Enter'){ submitStaffPassword(); }"
      >

      <p
        id="staffPasswordMessage"
        style="
          min-height:1.5em;
          margin:-4px 0 8px;
          text-align:center;
          color:#dc2626;
          font-weight:900;
        "
      ></p>

      <button class="primary" type="button" onclick="submitStaffPassword()">
        管理画面を開く
      </button>

      <button class="ghost" type="button" onclick="closeStaffLogin()">
        閉じる
      </button>
    </div>
  </div>

  <div id="scannerModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div id="scannerPill" class="pill">📷 ミッションQR</div>
      <h2 id="scannerTitle">QRコードを<ruby>読<rt>よ</rt></ruby>み<ruby>取<rt>と</rt></ruby>ろう</h2>

      <div id="scannerNote" class="scan-note">
        ミッションに<ruby>成功<rt>せいこう</rt></ruby>したら、スタッフが<ruby>案内<rt>あんない</rt></ruby>するQRコードをカメラに<ruby>写<rt>うつ</rt></ruby>してね。
      </div>

      <div id="reader"></div>

      <button class="danger" type="button" onclick="closeScanner()">カメラを<ruby>閉<rt>と</rt></ruby>じる</button>
    </div>
  </div>

  <!-- Apps ScriptへGET送信するための非表示フレーム -->
  <iframe
    id="startLogFrame"
    title="開始時刻ログ送信用"
    style="display:none"
  ></iframe>

  <script>

   const missions = [

      "<ruby>輪投<rt>わな</rt></ruby>げの<ruby>試練<rt>しれん</rt></ruby>に<ruby>挑戦<rt>ちょうせん</rt></ruby>しよう！",
    success:
      "<ruby>風<rt>かぜ</rt></ruby>の<ruby>冒険<rt>ぼうけん</rt></ruby>クリア！<ruby>輪投<rt>わな</rt></ruby>げの<ruby>試練<rt>しれん</rt></ruby>を<ruby>乗<rt>の</rt></ruby>り<ruby>越<rt>こ</rt></ruby>えたぞ！",
    next:
      "<ruby>風<rt>かぜ</rt></ruby>のスタンプをゲット！ほかの<ruby>冒険<rt>ぼうけん</rt></ruby>にも<ruby>挑戦<rt>ちょうせん</rt></ruby>しよう！",

  {

    before:
      "<ruby>水<rt>みず</rt></ruby>の<ruby>試練<rt>しれん</rt></ruby>！ヨーヨー<ruby>釣<rt>つ</rt></ruby>りに<ruby>挑戦<rt>ちょうせん</rt></ruby>しよう！",
    success:
      "<ruby>水<rt>みず</rt></ruby>の<ruby>冒険<rt>ぼうけん</rt></ruby>クリア！ヨーヨーを<ruby>上手<rt>じょうず</rt></ruby>に<ruby>釣<rt>つ</rt></ruby>り<ruby>上<rt>あ</rt></ruby>げたぞ！",
    next:
      "<ruby>水<rt>みず</rt></ruby>のスタンプをゲット！ほかの<ruby>冒険<rt>ぼうけん</rt></ruby>にも<ruby>挑戦<rt>ちょうせん</rt></ruby>しよう！",
    scene: "water"
  },

    function createSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return "session-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    }

    function logGameStart() {
      if (
        !START_LOG_URL ||
        START_LOG_URL.includes("PASTE_YOUR_APPS_SCRIPT")
      ) {
        console.warn("開始ログURLが未設定です。");
        return;
      }

      // 入口QR（?start=1）から開いた時だけ、新しい参加セッションを作成
      const params = new URLSearchParams(window.location.search);

      if (params.get("start") !== "1") {
        return;
      }

      sessionId = createSessionId();
      localStorage.setItem(STORAGE_SESSION_ID, sessionId);
      localStorage.removeItem(STORAGE_AR_RETURN_PENDING);

      const now = new Date();

      const localDate = now.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });

      const localTime = now.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      const query = new URLSearchParams({
        event: "game_start",
        sessionId: sessionId,
        date: localDate,
        time: localTime,
        iso: now.toISOString(),
        nonce: String(Date.now()),
        cache: String(Math.random())
      });

      const frame = document.getElementById("startLogFrame");
      frame.src = START_LOG_URL + "?" + query.toString();

      console.log("入場ログを送信しました。", sessionId);
    }

    function logGameExit() {
      if (
        !START_LOG_URL ||
        START_LOG_URL.includes("PASTE_YOUR_APPS_SCRIPT")
      ) {
        console.warn("退出ログURLが未設定です。");
        return;
      }

      if (!sessionId) {
        sessionId = localStorage.getItem(STORAGE_SESSION_ID) || "";
      }

      if (!sessionId) {
        console.warn("退出ログ用のSessionIDがありません。");
        return;
      }

      const now = new Date();

      const localDate = now.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });

      const localTime = now.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      const query = new URLSearchParams({
        event: "exit",
        sessionId: sessionId,

        // 新しいApps Script用
        exitDate: localDate,
        exitTime: localTime,
        exitIso: now.toISOString(),

        // 旧Apps Scriptでも受け取りやすいように残す
        date: localDate,
        time: localTime,
        iso: now.toISOString(),

        nonce: String(Date.now()),
        cache: String(Math.random())
      });

      const frame = document.getElementById("startLogFrame");
      frame.src = START_LOG_URL + "?" + query.toString();

      console.log("退出ログを送信しました。", sessionId);
    }

    function processArQr(decodedText) {
      const value = String(decodedText).trim();

      let targetUrl;

      try {
        targetUrl = new URL(value);
      } catch (error) {
        alert("これはARサイトのQRコードではありません。スタッフに確認してね。");
        return;
      }

      if (targetUrl.protocol !== "https:" && targetUrl.protocol !== "http:") {
        alert("これはARサイトのQRコードではありません。スタッフに確認してね。");
        return;
      }

      closeScanner(() => {
        // ARから戻った時に退出QR画面を表示するための印
        localStorage.setItem(STORAGE_AR_RETURN_PENDING, "1");

        // QRに入っているARサイトへ移動
        window.location.href = targetUrl.href;
      });
    }

        </div>
      `);
    }

    function closeScanner(callback) {
      scannerModal.classList.remove("show");
      scannerModal.setAttribute("aria-hidden", "true");

      const finish = () => {
        qrScanner = null;
        scanning = false;

        if (typeof callback === "function") {
          callback();
        }
      };

      if (qrScanner && scanning) {
        qrScanner.stop()
          .then(() => {
            qrScanner.clear();
            finish();
          })
          .catch(finish);
      } else {
        finish();
      }
    }

    function findMission(text) {
      const clean = String(text).trim().toUpperCase();

      return missions.find(mission => {
        return clean === mission.qr || clean.includes(mission.qr);
      });
    }

    function processScannedMission(mission) {
      if (completed.includes(mission.id)) {
        alert("このミッションはすでにクリアしています。");
        return;
      }

      completed.push(mission.id);
      save();

      closeScanner(() => {
        renderSuccess(mission);
      });
    }

    function openStaffLogin() {
      const input = document.getElementById("staffPasswordInput");
      const message = document.getElementById("staffPasswordMessage");

      if (input) {
        input.value = "";
      }

      if (message) {
        message.textContent = "";
      }

      staffLoginModal.classList.add("show");
      staffLoginModal.setAttribute("aria-hidden", "false");

      setTimeout(() => {
        if (input) {
          input.focus();
        }
      }, 100);
    }

    function closeStaffLogin() {
      staffLoginModal.classList.remove("show");
      staffLoginModal.setAttribute("aria-hidden", "true");
    }

    function submitStaffPassword() {
      const input = document.getElementById("staffPasswordInput");
      const message = document.getElementById("staffPasswordMessage");

      const rawPassword = input ? input.value : "";
      const password = rawPassword
        .replace(/[０-９]/g, character => {
          return String.fromCharCode(character.charCodeAt(0) - 0xFEE0);
        })
        .replace(/\s+/g, "");

      if (password !== STAFF_PASSWORD) {
        if (message) {
          message.textContent = "パスワードが違います。";
        }

        if (input) {
          input.focus();
          input.select();
        }

        return;
      }

      if (message) {
        message.textContent = "";
      }

      closeStaffLogin();
      renderStaffPanel();
    }

    function renderStaffPanel() {
      setScreen(`
        <div class="pill">🔧 スタッフ管理</div>
        <h1 style="font-size:32px">ミッション<ruby>手動登録<rt>しゅどうとうろく</rt></ruby></h1>

        <div class="staff-panel">
          <p style="text-align:center;font-weight:800">
            QRコードが<ruby>反応<rt>はんのう</rt></ruby>しなかった<ruby>場合<rt>ばあい</rt></ruby>だけ<ruby>使用<rt>しよう</rt></ruby>してください。
          </p>

          <div class="staff-grid">
            ${missions.map(mission => {
              const done = completed.includes(mission.id);

              return `
                <button
                  class="${done ? "done" : ""}"
                  type="button"
                  onclick="staffToggleMission('${mission.id}')"
                >
                  ${mission.emoji} ${mission.name}<br>
                  ${done
                    ? "<ruby>登録済<rt>とうろくず</rt></ruby>み・タップで<ruby>取消<rt>とりけ</rt></ruby>し"
                    : "タップして<ruby>登録<rt>とうろく</rt></ruby>"
                  }
                </button>
              `;
            }).join("")}
          </div>
        </div>

        <button class="primary" type="button" onclick="renderMissionHub()">
          ゲーム<ruby>画面<rt>がめん</rt></ruby>へ<ruby>戻<rt>もど</rt></ruby>る
        </button>

        <button class="ghost" type="button" onclick="renderStart()">
          トップへ<ruby>戻<rt>もど</rt></ruby>る
        </button>
      `);
    }

    function staffToggleMission(id) {
      const mission = missions.find(item => item.id === id);

      if (!mission) {
        return;
      }

      if (completed.includes(id)) {
        completed = completed.filter(doneId => doneId !== id);
      } else {
        completed.push(id);
      }

      save();
      renderStaffPanel();
    }

    function renderRewardScreen() {
      setScreen(`
        <div class="confetti">
          ${Array.from({ length: 28 }).map((_, index) => {
            const colors = ["#facc15", "#22c55e", "#38bdf8", "#fb923c", "#f472b6"];

            return `
              <span style="
                left:${Math.random() * 100}%;
                animation-delay:${Math.random() * 2}s;
                background:${colors[index % colors.length]}
              "></span>
            `;
          }).join("")}
        </div>

        <div class="hero">
          <div class="pill">
            🎉 3つの<ruby>冒険<rt>ぼうけん</rt></ruby>クリア！ 🎉
          </div>

          <h1>
            スタッフに
            <br>
            この<ruby>画面<rt>がめん</rt></ruby>を<ruby>見<rt>み</rt></ruby>せてね！
          </h1>

          <div class="hero-icon">🍬🎁✨</div>

          <div class="glass">
            <h2>
              ${playerCount}<ruby>人<rt>にん</rt></ruby>で
              <ruby>冒険成功<rt>ぼうけんせいこう</rt></ruby>！
            </h2>

            <p>
              3つの<ruby>冒険<rt>ぼうけん</rt></ruby>を
              すべてクリアしたよ！
            </p>

            <p style="margin-top:12px">
              <strong>
                この<ruby>画面<rt>がめん</rt></ruby>をスタッフに<ruby>見<rt>み</rt></ruby>せると、
                お<ruby>菓子<rt>かし</rt></ruby>がもらえるよ！
              </strong>
            </p>
          </div>

          <div class="next-box">
            お<ruby>菓子<rt>かし</rt></ruby>をもらったら、<br>
            下のボタンを<ruby>押<rt>お</rt></ruby>して
            ARのQRコードを<ruby>読<rt>よ</rt></ruby>み<ruby>取<rt>と</rt></ruby>ろう！
          </div>

          <button class="primary" type="button" onclick="openArScanner()">
            📷 ARのQRコードを<ruby>読<rt>よ</rt></ruby>む
          </button>

          <button class="ghost" type="button" onclick="renderStart()">
            トップに<ruby>戻<rt>もど</rt></ruby>る
          </button>
        </div>
      `);
    }

    function resetGame() {
      completed = [];
      playerCount = 1;
      sessionId = "";
      scannerMode = "mission";

      localStorage.removeItem(STORAGE_PROGRESS);
      localStorage.removeItem(STORAGE_PLAYER_COUNT);
      localStorage.removeItem(STORAGE_SESSION_ID);
      localStorage.removeItem(STORAGE_AR_RETURN_PENDING);

      closeStaffLogin();

      if (scannerModal.classList.contains("show")) {
        closeScanner(() => {
          renderStart();
        });
        return;
      }

      renderStart();
    }

    logGameStart();
    renderStart();

    window.addEventListener("pageshow", () => {
      const shouldShowExit =
        localStorage.getItem(STORAGE_AR_RETURN_PENDING) === "1";

      if (shouldShowExit) {
        sessionId = localStorage.getItem(STORAGE_SESSION_ID) || sessionId;
        renderExitQrScreen();
      }
    });
  </script>
</body>
</html>
